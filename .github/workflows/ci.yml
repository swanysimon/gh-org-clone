name: ci
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # macOS matters: the case-collision and /dev/null tty handling exist
        # for it specifically.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Tests drive the real git binary; gh is only looked up on PATH (its
      # output is stubbed), and both are preinstalled on GitHub runners.
      - run: go test -race -count=1 ./...
